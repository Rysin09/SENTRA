# Alembic configuration for SENTRA
# The sqlalchemy.url is overridden at runtime by alembic/env.py
# using the DATABASE_URL from pydantic-settings / .env.
# Do not hardcode a real URL here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden in env.py from settings
sqlalchemy.url = postgresql+psycopg2://sentra:changeme@localhost:5432/sentra_dev

[post_write_hooks]
# Uncomment to auto-format migrations with Ruff after generation:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
